<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aureus Launcher</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <aside>
      <div class="brand"><span class="brand-mark">A</span><span>AUREUS</span></div>
      <nav>
        <button class="nav-item active">Inicio</button>
        <button class="nav-item">Instancias</button>
        <button class="nav-item">Rendimiento</button>
        <button class="nav-item">Ajustes</button>
      </nav>
      <div class="account">
        <div class="avatar">?</div>
        <div><strong>Sin sesión</strong><small>Microsoft</small></div>
      </div>
    </aside>

    <main>
      <header><div><p class="eyebrow">MINECRAFT JAVA</p><h1>Juega más fluido.<br><span>Compite mejor.</span></h1></div><span class="version">Aureus 0.3.0</span></header>
      <section class="hero">
        <div class="hero-copy">
          <span class="badge">FABRIC · 1.21.11</span>
          <h2>Aureus Client</h2>
          <p>Optimización medible y herramientas PvP de juego limpio.</p>
          <div class="actions">
            <button id="install" class="primary">Instalar Aureus</button>
            <button id="login" class="secondary">Iniciar con Microsoft</button>
          </div>
          <p id="message" class="message">Comprobando instalación…</p>
        </div>
        <div class="orb"><span>FPS</span><strong id="profile-score">MAX</strong></div>
      </section>

      <section class="grid">
        <article><label>Perfil de rendimiento</label><select id="profile"><option>MAX FPS</option><option selected>EQUILIBRADO</option><option>CALIDAD</option></select></article>
        <article><label>Memoria asignada</label><div class="range-row"><input id="memory" type="range" min="2" max="16" value="4" /><output id="memory-value">4 GB</output></div></article>
        <article class="status-card"><label>Estado del sistema</label><ul><li><span>Java</span><b id="java-status">…</b></li><li><span>Minecraft</span><b id="mc-status">…</b></li><li><span>Aureus Mod</span><b id="mod-status">…</b></li></ul></article>
      </section>
    </main>
  </body>
</html>
